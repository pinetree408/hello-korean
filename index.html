    const state = { page: 'home', unitId: 1, studyIndex: 0, quizIndex: 0, score: 0, selected: null, answered: false, questions: [] };
    const $app = document.getElementById('app');
    const unit = () => UNITS.find(u => u.id === state.unitId) || UNITS[0];
    const vocab = () => unit().vocab;

    function runTests() {
      console.assert(Array.isArray(UNITS), 'UNITS should be an array');
      console.assert(UNITS.length >= 10, 'UNITS should include at least 10 units');
      console.assert(UNITS.every(u => u.id && u.title && !('subtitle' in u) && u.youtube && u.zep && Array.isArray(u.vocab)), 'Every unit needs id, title, youtube, zep, vocab and no subtitle');
      console.assert(UNITS.every(u => ['english', 'chinese', 'russian', 'vietnamese'].every(k => u.zep[k])), 'Every unit needs 4 ZEP links');
    }

    function render() { $app.innerHTML = ({ home, unitMenu, study, quiz, result, zepMenu })[state.page](); }
    function go(page) { window.speechSynthesis?.cancel(); state.page = page; render(); }
    function selectUnit(id) { state.unitId = id; state.studyIndex = 0; state.quizIndex = 0; state.selected = null; state.answered = false; go('unitMenu'); }
    function shuffle(list) { const arr = [...list]; for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
    function speak(text, rate = 0.9) { if (!('speechSynthesis' in window)) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'ko-KR'; u.rate = rate; speechSynthesis.speak(u); }
    function speakStudy(rate) { speak(vocab()[state.studyIndex].audio, rate); }
    function speakQuiz(rate) { speak(state.questions[state.quizIndex].data.audio, rate); }

    function imageTag(data, cls = 'h-32 w-44') {
      return `<img src="${data.imageUrl}" alt="${data.picture}" class="${cls} rounded-xl border border-slate-200 bg-white object-contain shadow-sm" loading="lazy" onerror="this.outerHTML='<div class=&quot;${cls} flex items-center justify-center rounded-xl border border-red-200 bg-red-50 p-3 text-center text-xs font-bold text-red-600&quot;>이미지 없음<br>${data.picture}</div>'">`;
    }

    function header(title, desc, backPage = '') {
      return `<div class="sticky top-0 z-20 border-b border-slate-200 bg-white/90 backdrop-blur"><div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4 sm:px-6"><div><div class="text-xl font-extrabold tracking-tight text-slate-900 sm:text-2xl">${title}</div>${desc ? `<div class="mt-1 text-sm text-slate-500">${desc}</div>` : ''}</div>${backPage ? `<button onclick="go('${backPage}')" class="rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-700 shadow-sm hover:bg-slate-50">뒤로</button>` : ''}</div></div>`;
    }

    function home() {
      return `<main class="min-h-screen bg-slate-100"><section class="w-full bg-white px-4 py-10 sm:px-8 lg:px-16"><div class="mx-auto flex max-w-5xl items-center justify-center gap-8"><div class="max-w-2xl"><img src="./static/images/header-title.png" alt="안녕, 한국어" class="h-auto w-[320px] sm:w-[420px]" /><p class="mt-6 text-lg font-bold leading-8 text-slate-600 sm:text-xl">어린이를 위한 쉽고 재미있는 한국어 학습 사이트입니다.</p><p class="mt-1 text-lg font-bold leading-8 text-slate-600 sm:text-xl">단계별로 차근차근, 즐겁게 배워보세요!</p><a href="${RESOURCE_LINK}" target="_blank" rel="noreferrer" class="mt-8 inline-block rounded-2xl bg-gradient-to-r from-sky-500 to-indigo-600 px-8 py-4 text-lg font-extrabold text-white shadow-lg shadow-indigo-200 hover:scale-[1.01] active:scale-[.99]">📖 안녕 한국어 자료 모음집</a></div><div class="hidden lg:flex items-center justify-center"><img src="./static/images/header-icon.png" alt="" class="h-[280px] w-auto object-contain" /></div></div></section><section class="mx-auto max-w-6xl px-4 py-10 sm:px-8 lg:px-12 fade-in"><div class="mb-8"><h2 class="text-3xl font-extrabold tracking-tight text-slate-950">한국어 강의</h2><p class="mt-2 text-lg font-bold text-slate-500">단원을 선택해 학습하세요</p></div><div class="grid gap-6">${UNITS.map(u => `<section class="rounded-[24px] bg-gradient-to-r from-indigo-600 via-blue-600 to-sky-500 p-6 text-white shadow-xl shadow-slate-300/40"><div class="flex items-center justify-between gap-6"><div class="flex flex-col"><span class="text-3xl font-extrabold text-white">${u.id}단원</span><span class="mt-2 text-xl font-bold text-white/90">${u.title}</span></div><button onclick="selectUnit(${u.id})" class="shrink-0 rounded-2xl bg-white px-6 py-3 text-base font-extrabold text-indigo-700 shadow-lg hover:bg-slate-100">학습하기 ›</button></div></section>`).join('')}</div></section></main>`;
    }

    function unitMenu() {
      const u = unit();
      const isReviewUnit = u.practiceOnly === true;
      return `${header(`${u.id}단원`, u.title, 'home')}<main class="mx-auto max-w-6xl px-4 py-8 sm:px-6 fade-in"><section class="mb-6 rounded-[24px] bg-white p-6 shadow-sm ring-1 ring-slate-200 sm:p-8"><div class="text-sm font-bold text-indigo-600">${isReviewUnit ? '종합연습 안내' : '학습 안내'}</div><div class="mt-2 text-2xl font-extrabold text-slate-900">${isReviewUnit ? '종합연습을 시작해 보세요.' : '원하는 학습을 선택하세요.'}</div><p class="mt-3 text-slate-500">${isReviewUnit ? '영상 보기와 ZEP퀴즈를 통해 1~9단원 내용을 종합적으로 복습합니다.' : '영상 보기, 단어 공부, 반복 연습, ZEP퀴즈 단어 테스트를 할 수 있습니다.'}</p></section><div class="grid gap-5 md:grid-cols-2">${menuCard('▶️', '동영상 보기', isReviewUnit ? '종합연습 강의 영상으로 이동합니다.' : '유튜브 학습 영상으로 이동합니다.', `<a href="${u.youtube}" target="_blank" rel="noreferrer" class="mt-4 inline-block w-full rounded-2xl bg-red-500 px-5 py-3 text-center font-extrabold text-white shadow hover:bg-red-600">동영상 보러가기</a>`, 'red')}${isReviewUnit ? '' : menuCard('📚', '단어 공부', '핵심 단어를 그림과 소리로 공부합니다.', `<button onclick="go('study')" class="mt-4 w-full rounded-2xl bg-emerald-500 px-5 py-3 font-extrabold text-white shadow hover:bg-emerald-600">단어 공부하기</button>`, 'emerald')}${isReviewUnit ? '' : menuCard('🔁', '단어 연습하기', '배운 단어를 반복 문제로 연습합니다.', `<button onclick="startQuiz()" class="mt-4 w-full rounded-2xl bg-indigo-600 px-5 py-3 font-extrabold text-white shadow hover:bg-indigo-700">반복 연습 시작</button>`, 'indigo')}${menuCard('🎮', isReviewUnit ? 'ZEP으로 종합 평가' : 'ZEP으로 단원 평가', isReviewUnit ? '언어를 선택한 뒤 종합 ZEP퀴즈로 이동합니다.' : '언어를 선택한 뒤 ZEP퀴즈로 이동합니다.', `<button onclick="go('zepMenu')" class="mt-4 w-full rounded-2xl bg-violet-600 px-5 py-3 font-extrabold text-white shadow hover:bg-violet-700">ZEP퀴즈 선택하기</button>`, 'violet')}</div></main>`;
    }

    function menuCard(icon, title, desc, action, color) { return `<section class="rounded-[28px] bg-white p-6 shadow-sm ring-1 ring-slate-200"><div class="mb-5 inline-flex h-14 w-14 items-center justify-center rounded-2xl bg-${color}-50 text-3xl">${icon}</div><div class="text-2xl font-extrabold">${title}</div><p class="mt-3 min-h-[56px] text-sm leading-6 text-slate-500">${desc}</p>${action}</section>`; }

    function study() {
      const words = vocab();
      const current = state.studyIndex + 1;
      const data = words[state.studyIndex];
      return `${header(`${unit().id}단원`, unit().title, 'unitMenu')}<main class="mx-auto max-w-6xl px-4 py-8 sm:px-6 fade-in"><div class="grid gap-6 lg:grid-cols-[1.1fr_.9fr]"><section class="rounded-[32px] bg-white p-8 shadow-sm ring-1 ring-slate-200 sm:p-10"><div class="text-right text-sm font-bold text-slate-400">${current} / ${words.length}</div><div class="text-center"><div class="mx-auto flex h-44 w-56 items-center justify-center rounded-[32px] bg-slate-100 p-4 shadow-inner sm:h-56 sm:w-72">${imageTag(data, 'h-32 w-48 sm:h-40 sm:w-60')}</div><div class="mt-4 text-sm font-bold text-indigo-600">${data.picture}</div><div class="mt-2 text-3xl font-extrabold sm:text-4xl">${data.word}</div><p class="mt-3 text-slate-500">그림을 보고 단어를 읽고 소리를 들어 보세요.</p></div><div class="mt-8 flex flex-col gap-3"><div class="flex flex-col gap-3 sm:flex-row sm:justify-center"><button onclick="speakStudy(0.9)" class="rounded-2xl bg-indigo-600 px-6 py-3 font-extrabold text-white shadow hover:bg-indigo-700">🔊 소리 듣기</button><button onclick="speakStudy(0.5)" class="rounded-2xl border border-indigo-200 bg-white px-6 py-3 font-bold text-indigo-700 shadow-sm hover:bg-indigo-50">🐢 느리게 듣기</button></div><div class="flex justify-center gap-2"><button onclick="moveStudy(-1)" class="rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-600 shadow-sm hover:bg-slate-50">◀ 이전</button><button onclick="moveStudy(1)" class="rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-600 shadow-sm hover:bg-slate-50">다음 ▶</button></div></div></section><section class="rounded-[32px] bg-white p-5 shadow-sm ring-1 ring-slate-200 sm:p-6"><div class="mb-4 text-lg font-extrabold">단어 목록</div><div class="grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-2">${words.map((v, i) => wordListButton(v, i)).join('')}</div></section></div></main>`;
    }

    function moveStudy(step) { const total = vocab().length; state.studyIndex = (state.studyIndex + step + total) % total; render(); }
    function wordListButton(data, index) { const active = index === state.studyIndex; return `<button onclick="state.studyIndex=${index}; render();" class="rounded-2xl border p-4 text-left ${active ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-200 bg-white text-slate-700 hover:bg-slate-50'}"><div class="flex h-12 items-center">${imageTag(data, 'h-10 w-16')}</div><div class="mt-2 text-sm font-bold leading-5">${data.word}</div><div class="mt-1 text-[11px] opacity-70">${data.picture}</div></button>`; }

    function startQuiz() {
      const words = vocab();
      state.questions = shuffle([...words.map(data => question('imageToWord', data)), ...shuffle(words).slice(0, Math.min(8, words.length)).map(data => question('audioToWord', data)), ...words.filter(v => v.type === 'expression').map(data => question('wordToImage', data))]).slice(0, 20);
      state.quizIndex = 0; state.score = 0; state.selected = null; state.answered = false; go('quiz');
    }
    function question(type, data) { return { type, data, answer: data.word, choices: type === 'wordToImage' ? imageChoices(data) : wordChoices(data) }; }
    function wordChoices(answer) { return shuffle([answer.word, ...shuffle(vocab().filter(v => v.word !== answer.word)).slice(0, 3).map(v => v.word)]); }
    function imageChoices(answer) { return shuffle([answer, ...shuffle(vocab().filter(v => v.word !== answer.word)).slice(0, 3)]); }

    function quiz() {
      const q = state.questions[state.quizIndex];
      const percent = Math.round((state.quizIndex / state.questions.length) * 100);
      return `${header(`${unit().id}단원`, unit().title, 'unitMenu')}<main class="mx-auto max-w-4xl px-4 py-8 sm:px-6 fade-in"><div class="mb-5 overflow-hidden rounded-full bg-slate-200"><div class="h-3 rounded-full bg-indigo-600" style="width:${percent}%"></div></div><section class="rounded-[32px] bg-white p-6 shadow-sm ring-1 ring-slate-200 sm:p-8"><div class="text-sm font-bold text-indigo-600">QUIZ</div><div class="mt-2 text-2xl font-extrabold leading-tight sm:text-3xl">${quizPrompt(q.type)}</div>${quizContent(q)}<div class="grid gap-4 sm:grid-cols-2">${q.choices.map((choice, index) => choiceButton(choice, q, index)).join('')}</div>${state.answered ? feedback(q) : ''}</section></main>`;
    }

    function quizPrompt(type) { return { imageToWord: '그림을 보고 알맞은 단어를 고르세요.', audioToWord: '소리를 듣고 알맞은 말을 고르세요.', wordToImage: '말을 보고 알맞은 그림을 고르세요.' }[type]; }
    function quizContent(q) {
      if (q.type === 'imageToWord') {
        return `
          <div class="my-8 text-center">
            <div class="mx-auto flex h-44 w-56 items-center justify-center rounded-[32px] bg-slate-100 p-4 shadow-inner sm:h-56 sm:w-72">
              ${imageTag(q.data, 'h-32 w-48 sm:h-40 sm:w-60')}
            </div>
          </div>
        `;
      }

      if (q.type === 'audioToWord') {
        return `
          <div class="my-8 text-center">
            <div class="flex flex-col items-center gap-3 sm:flex-row sm:justify-center">

              <button
                onclick="speakQuiz(0.9)"
                class="rounded-full bg-indigo-600 px-8 py-5 text-lg font-extrabold text-white shadow-lg hover:bg-indigo-700"
              >
                🔊 소리 듣기
              </button>

              <button
                onclick="speakQuiz(0.5)"
                class="rounded-full border border-indigo-200 bg-white px-8 py-5 text-lg font-bold text-indigo-700 shadow-sm hover:bg-indigo-50"
              >
                🐢 느리게 듣기
              </button>

            </div>
          </div>
        `;
      }

      return `
        <div class="my-8 rounded-[24px] bg-slate-100 p-6 text-center text-3xl font-extrabold text-slate-800 sm:text-4xl">
          ${q.data.word}
        </div>
      `;
    }
    function choiceButton(choice, q, index) {
      const value = typeof choice === 'string' ? choice : choice.word;
      const isSelected = state.selected === value;
      const isCorrect = value === q.answer;
      let cls = 'border-slate-200 bg-white text-slate-800 hover:bg-slate-50';
      if (state.answered) cls = isCorrect ? 'border-emerald-500 bg-emerald-50 text-emerald-700' : isSelected ? 'border-red-500 bg-red-50 text-red-700' : cls;
      const body = typeof choice === 'string' ? choice : imageTag(choice, 'mx-auto h-20 w-32 sm:h-24 sm:w-36');
      return `<button onclick="selectAnswer(${index})" class="rounded-[22px] border p-5 text-center text-lg font-bold transition hover:-translate-y-0.5 ${cls}">${body}</button>`;
    }
    function selectAnswer(index) { if (state.answered) return; const q = state.questions[state.quizIndex]; const choice = q.choices[index]; const value = typeof choice === 'string' ? choice : choice.word; state.selected = value; state.answered = true; if (value === q.answer) state.score++; render(); }
    function feedback(q) { const correct = state.selected === q.answer; return `<div class="mt-6 rounded-[24px] bg-slate-50 p-5"><div class="text-lg font-extrabold ${correct ? 'text-emerald-700' : 'text-red-700'}">${correct ? '정답입니다!' : `오답입니다. 정답은 “${q.answer}”입니다.`}</div><button onclick="nextQuestion()" class="mt-4 rounded-2xl bg-indigo-600 px-5 py-3 font-extrabold text-white shadow hover:bg-indigo-700">다음 문제</button></div>`; }
    function nextQuestion() { state.selected = null; state.answered = false; if (state.quizIndex < state.questions.length - 1) state.quizIndex++; else state.page = 'result'; render(); }
    function result() { const total = state.questions.length; const percent = Math.round((state.score / total) * 100); const message = percent >= 90 ? '아주 잘했어요!' : percent >= 70 ? '잘했어요!' : '다시 한 번 연습해 보세요!'; return `${header('단어 연습 결과', `${unit().id}단원 · ${unit().title}`, 'unitMenu')}<main class="mx-auto max-w-3xl px-4 py-10 sm:px-6 fade-in"><section class="rounded-[32px] bg-white p-8 text-center shadow-sm ring-1 ring-slate-200 sm:p-10"><div class="text-6xl">🏆</div><div class="mt-4 text-3xl font-extrabold sm:text-4xl">${message}</div><div class="mt-4 text-lg text-slate-500">총 ${total}문제 중 ${state.score}문제를 맞혔어요.</div><div class="mt-6 text-6xl font-extrabold text-indigo-600">${state.score}<span class="ml-1 text-2xl text-slate-400">/ ${total}</span></div><div class="mt-3 text-xl font-bold text-slate-700">정답률 ${percent}%</div><div class="mx-auto mt-6 h-4 max-w-xl overflow-hidden rounded-full bg-slate-200"><div class="h-full rounded-full bg-indigo-600" style="width:${percent}%"></div></div><div class="mt-8 grid gap-3 sm:grid-cols-2"><button onclick="startQuiz()" class="rounded-2xl bg-indigo-600 px-6 py-3 font-extrabold text-white shadow hover:bg-indigo-700">다시 연습하기</button><button onclick="go('unitMenu')" class="rounded-2xl border border-slate-200 bg-white px-6 py-3 font-bold text-slate-700 shadow-sm hover:bg-slate-50">단원 활동으로</button></div></section></main>`; }
    function zepMenu() {
      const links = unit().zep;

      const cards = [
        ['./static/images/flags/en.png', '영어', links.english],
        ['./static/images/flags/zh.png', '중국어', links.chinese],
        ['./static/images/flags/ru.png', '러시아어', links.russian],
        ['./static/images/flags/vi.png', '베트남어', links.vietnamese]
      ];

      return `${header('ZEP퀴즈 단어 테스트', `${unit().id}단원 · ${unit().title}`, 'unitMenu')}
        <main class="mx-auto max-w-4xl px-4 py-8 sm:px-6 fade-in">
          <div class="grid gap-5 sm:grid-cols-2">
            ${cards.map(([flag, label, url]) => `
              <a href="${url}" target="_blank" rel="noreferrer" class="rounded-[28px] bg-white p-8 text-center shadow-sm ring-1 ring-slate-200 hover:bg-slate-50">
                <img src="${flag}" alt="${label}" class="mx-auto h-14 w-20 rounded-xl object-cover shadow-sm ring-1 ring-slate-200" />
                <div class="mt-4 text-2xl font-extrabold">${label}</div>
              </a>
            `).join('')}
          </div>
        </main>`;
    }
    runTests();
    render();
  </script>
</body>
</html>
